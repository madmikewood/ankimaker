<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anki-Sim Dark Editor</title>
    <style>
        html, body { 
            max-width: 100%; overflow-x: hidden; margin: 0; padding: 10px; 
            background: #1c1c1e; color: #f2f2f7; font-family: -apple-system, sans-serif; 
        }
        
        .controls { 
            position: sticky; top: 0; z-index: 100;
            margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
            background: #2c2c2e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            border: 1px solid #3a3a3c;
        }

        #gridContainer { 
            display: grid; 
            grid-template-columns: 40px 25% 35% 40%; 
            gap: 2px; background: #3a3a3c; border: 2px solid #3a3a3c; width: 100%;
        }

        .header { background: #3a3a3c; padding: 10px; font-weight: bold; text-align: center; font-size: 12px; color: #aeaeae; }
        .cell-wrapper { background: #1c1c1e; padding: 5px; display: flex; align-items: flex-start; min-width: 0; overflow: hidden; }

        .anki-sim-wrapper { 
            width: 100%; padding: 25px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 16px;
            box-sizing: border-box; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .anki-sim { width: 100%; line-height: 1.6; text-align: center; word-wrap: break-word; color: #ffffff; }
        
        .cloze-hidden { background-color: #004a99; color: #80bfff; padding: 0 6px; border-radius: 4px; cursor: default; font-weight: bold; }
        .cloze-revealed { color: #00aaff; font-weight: bold; background: none; }

        .del-btn { background: #411d1d; color: #ff453a; border: none; width: 30px; height: 30px; cursor: pointer; font-weight: bold; border-radius: 6px; }
        textarea { 
            width: 100%; min-height: 80px; border: none; outline: none; 
            font-size: 14px; line-height: 1.5; resize: none; overflow: hidden; 
            font-family: inherit; box-sizing: border-box; background: transparent; color: #f2f2f7;
        }

        .status { font-size: 11px; color: #8e8e93; margin-left: auto; }
        button { cursor: pointer; padding: 8px 14px; border-radius: 8px; border: 1px solid #3a3a3c; background: #3a3a3c; color: #f2f2f7; font-weight: 500; }
        .anki-btn { background: #007aff; color: white; border: none; }
        .toggle-btn { background: #32d74b; color: #000; border: none; min-width: 180px; font-weight: bold; }
        .num-input { width: 50px; padding: 5px; border: 1px solid #3a3a3c; border-radius: 6px; text-align: center; background: #1c1c1e; color: #ffffff; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="csvInput" accept=".csv" style="font-size: 12px;">
    <button onclick="downloadCSV()">Save Backup CSV</button>
    <button class="anki-btn" onclick="downloadAnki()">Export to Anki</button>
    
    <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:#aeaeae;">
        <span>Sim Width %</span>
        <input type="number" id="widthInput" class="num-input" value="35" min="10" max="60" onchange="updateLayout()">
    </div>
    <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:#aeaeae;">
        <span>Font Size (px)</span>
        <input type="number" id="fontInput" class="num-input" value="18" min="10" max="40" onchange="updateLayout()">
    </div>

    <button id="masterToggle" class="toggle-btn" onclick="toggleAllModes()">Switch to ANSWER Mode</button>
    <div class="status" style="margin-left:15px; font-size:10px;"><b>Cmd+Shift+L</b>: Add Spacers</div>
    <button onclick="clearData()" style="color: #ff453a; margin-left: auto; border-color: #411d1d;">Clear All</button>
    <div id="saveStatus" class="status">Initializing...</div>
</div>

<div id="gridContainer">
    <div class="header"></div>
    <div class="header">Concept</div>
    <div class="header">Notes</div>
    <div class="header">Anki Simulator</div>
</div>

<script>
    const grid = document.getElementById('gridContainer');
    const saveStatus = document.getElementById('saveStatus');
    let rowCount = 0;
    let isAnswerMode = false;

    function processLineBreaks(text, isForSim = true) {
        const lines = text.split('\n');
        let htmlParts = [];
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            let trimmed = line.trim();
            if (trimmed === '-') {
                htmlParts.push('<div style="height: 0.5em;"></div>');
            } else {
                if (isForSim) {
                    line = line.replace(/\*(.*?)\*/g, (match, content) => {
                        const parts = content.split(':');
                        const mainText = parts[0];
                        const hintText = parts[1] ? `[${parts[1]}]` : '[...]';
                        return isAnswerMode ? `<span class="cloze-revealed">${mainText}</span>` : `<span class="cloze-hidden">${hintText}</span>`;
                    });
                }
                let suffix = (i < lines.length - 1 && lines[i+1].trim() !== '-') ? "<br>" : "";
                htmlParts.push(line + suffix);
            }
        }
        return htmlParts.join('');
    }

    function updateAnkiPreview(index) {
        const a = document.getElementById(`cell-a-${index}`)?.value || '';
        const b = document.getElementById(`cell-b-${index}`)?.value || '';
        const sim = document.getElementById(`anki-${index}`);
        if (!sim) return;
        let title = a ? `<div style="font-weight:bold; margin-bottom:15px; border-bottom:1px solid #3a3a3c; padding-bottom:10px; color:#fff;">${a}</div>` : '';
        sim.innerHTML = title + processLineBreaks(b, true);
    }

    function downloadAnki() {
        let csv = "";
        for (let i = 1; i <= rowCount; i++) {
            const a = document.getElementById(`cell-a-${i}`)?.value || '';
            const b = document.getElementById(`cell-b-${i}`)?.value || '';
            if (a || b) {
                let colA = `<b>${a}</b><br>`;
                let rawB = b.split('\n').map(l => l.trim() === '-' ? '<div style="height: 0.5em;"></div>' : l).join('<br>');
                let finalB = rawB.replace(/\*(.*?)\*/g, (m, c) => {
                    const p = c.split(':');
                    return p[1] ? `{{c1::${p[0]}::${p[1]}}}` : `{{c1::${p[0]}}}`;
                });
                csv += `"${(colA + finalB).replace(/"/g, '""')}"\n`;
            }
        }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        link.download = 'anki_import.csv'; link.click();
    }

    function handleKey(e, el) {
        // Cmd+I / Ctrl+I: Cloze logic
        if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key === 'i') {
            e.preventDefault();
            const start = el.selectionStart, end = el.selectionEnd;
            if (start !== end) {
                el.value = el.value.substring(0, start) + `*${el.value.substring(start, end)}*` + el.value.substring(end);
            } else {
                el.value = el.value.split('\n').map(l => (l.trim() && !l.includes('*')) ? `*${l.trim()}*` : l).join('\n');
            }
            handleInput(el);
        }

        // NEW: Cmd+Shift+L / Ctrl+Shift+L: Insert spacers between lines
        if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'l') {
            e.preventDefault();
            const lines = el.value.split('\n').filter(l => l.trim() !== '-'); // Filter existing spacers first
            if (lines.length > 1) {
                el.value = lines.join('\n-\n');
            }
            handleInput(el);
        }
    }

    function updateLayout() {
        const simWidth = document.getElementById('widthInput').value;
        const fontSize = document.getElementById('fontInput').value;
        const remaining = 100 - simWidth - 5;
        grid.style.gridTemplateColumns = `40px ${remaining * 0.4}% ${remaining * 0.6}% ${simWidth}%`;
        document.querySelectorAll('.anki-sim').forEach(el => el.style.fontSize = fontSize + 'px');
        localStorage.setItem('pref_width', simWidth);
        localStorage.setItem('pref_font', fontSize);
    }

    function toggleAllModes() {
        isAnswerMode = !isAnswerMode;
        const btn = document.getElementById('masterToggle');
        btn.innerText = isAnswerMode ? "Switch to QUESTION Mode" : "Switch to ANSWER Mode";
        btn.style.background = isAnswerMode ? "#ff9f0a" : "#32d74b";
        for(let i=1; i<=rowCount; i++) updateAnkiPreview(i);
    }

    function createRow(valA = '', valB = '') {
        rowCount++;
        const rowNum = rowCount;
        const rowId = `row-${rowNum}`;
        const html = `
            <div class="cell-wrapper" data-row="${rowId}"><button class="del-btn" onclick="deleteRow('${rowId}')">×</button></div>
            <div class="cell-wrapper" data-row="${rowId}"><textarea id="cell-a-${rowNum}" oninput="handleInput(this)" onkeydown="handleKey(event, this)">${valA}</textarea></div>
            <div class="cell-wrapper" data-row="${rowId}"><textarea id="cell-b-${rowNum}" oninput="handleInput(this)" onkeydown="handleKey(event, this)">${valB}</textarea></div>
            <div class="cell-wrapper" data-row="${rowId}"><div class="anki-sim-wrapper"><div id="anki-${rowNum}" class="anki-sim"></div></div></div>
        `;
        grid.insertAdjacentHTML('beforeend', html);
        setTimeout(() => { updateAnkiPreview(rowNum); autoResize(document.getElementById(`cell-a-${rowNum}`)); updateLayout(); }, 50);
    }

    function handleInput(el) {
        const rowNum = el.id.split('-')[2];
        updateAnkiPreview(rowNum);
        autoResize(el);
        const all = document.querySelectorAll('textarea');
        if (all.length > 0 && (el === all[all.length - 1] || el === all[all.length - 2])) createRow();
    }

    function autoResize(el) {
        if (!el) return;
        const rowNum = el.id.split('-')[2];
        const a = document.getElementById(`cell-a-${rowNum}`), b = document.getElementById(`cell-b-${rowNum}`);
        if (a && b) {
            a.style.height = 'auto'; b.style.height = 'auto';
            const tallest = Math.max(a.scrollHeight, b.scrollHeight, 100);
            a.style.height = tallest + 'px'; b.style.height = tallest + 'px';
        }
    }

    function parseCSV(text) {
        const rows = []; let row = [], cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let char = text[i], next = text[i+1];
            if (char === '"' && inQuotes && next === '"') { cell += '"'; i++; }
            else if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { row.push(cell); cell = ''; }
            else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (cell || row.length) { row.push(cell); rows.push(row); row = []; cell = ''; }
                if (char === '\r' && next === '\n') i++;
            } else cell += char;
        }
        if (cell || row.length) { row.push(cell); rows.push(row); }
        return rows;
    }

    document.getElementById('csvInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function() {
            const data = parseCSV(reader.result);
            document.querySelectorAll('.cell-wrapper').forEach(el => el.remove());
            rowCount = 0;
            data.forEach(r => { if(r.length >= 2) createRow(r[0].trim(), r[1].trim()); });
            if (rowCount < 5) for (let i = 0; i < 5; i++) createRow();
        };
        reader.readAsText(e.target.files[0]);
    });

    function downloadCSV() {
        let csv = ""; const tx = document.querySelectorAll('textarea');
        for (let i = 0; i < tx.length; i += 2) {
            const a = tx[i].value.replace(/"/g, '""'), b = (tx[i+1]?.value || '').replace(/"/g, '""');
            if (a || b) csv += `"${a}","${b}"\n`;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'study_backup.csv'; a.click();
    }

    function deleteRow(id) { if(confirm("Delete row?")) document.querySelectorAll(`[data-row="${id}"]`).forEach(el => el.remove()); }
    function clearData() { if(confirm("Clear all data?")) { localStorage.clear(); location.reload(); } }

    setInterval(() => {
        const data = []; const tx = document.querySelectorAll('textarea');
        for (let i = 0; i < tx.length; i += 2) {
            const a = tx[i].value, b = tx[i+1]?.value || '';
            if (a || b) data.push([a, b]);
        }
        localStorage.setItem('studyData', JSON.stringify(data));
        saveStatus.innerText = "Autosaved: " + new Date().toLocaleTimeString();
    }, 15000);

    window.onload = () => {
        const w = localStorage.getItem('pref_width'), f = localStorage.getItem('pref_font');
        if(w) document.getElementById('widthInput').value = w;
        if(f) document.getElementById('fontInput').value = f;
        const saved = localStorage.getItem('studyData');
        if (saved) JSON.parse(saved).forEach(r => createRow(r[0], r[1]));
        if (rowCount < 5) for (let i = 0; i < 5; i++) createRow();
        updateLayout();
    };
</script>
</body>
</html>
